<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Soulsteads Model Router</title>
  <desc id="desc">One endpoint routes requests to three local inference servers.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#182b3a"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="300" rx="20" fill="url(#background)"/>
  <g font-family="system-ui, sans-serif">
    <text x="48" y="66" fill="#73e5c0" font-size="17" font-weight="700" letter-spacing="4">SOULSTEADS</text>
    <text x="48" y="123" fill="#f0f6fc" font-size="45" font-weight="750">Model Router</text>
    <text x="48" y="166" fill="#c1d1df" font-size="20">Your local models. One endpoint.</text>
    <text x="48" y="221" fill="#73e5c0" font-size="17">Blazing Fast. Capacity-aware routing. No BS</text>
    <g fill="none" stroke="#73e5c0" stroke-width="3">
