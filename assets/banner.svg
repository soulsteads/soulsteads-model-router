      <rect x="586" y="119" width="68" height="62" rx="12" fill="#1d3e49"/>
      <rect x="832" y="49" width="110" height="50" rx="10" fill="#1d3e49"/>
      <rect x="832" y="125" width="110" height="50" rx="10" fill="#1d3e49"/>
      <rect x="832" y="201" width="110" height="50" rx="10" fill="#1d3e49"/>
    </g>
    <g fill="#f0f6fc" font-size="14" text-anchor="middle">
      <text x="620" y="155">route</text>
      <text x="887" y="79">local A</text>
      <text x="887" y="155">local B</text>
      <text x="887" y="231">embed</text>
    </g>
  </g>
</svg>
