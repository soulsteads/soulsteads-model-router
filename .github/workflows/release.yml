name: GitHub Release assets

on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - 'tests/test_release_*.py'
      - tests/service_install_validation.py
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - 'src/**'
      - LICENSE
      - NOTICE
      - third_party/LiteLLM-LICENSE.txt

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test release assets and dependency notices offline
        run: python3 -B -m unittest discover -s tests -p 'test_release_*.py' -v
      - name: Prepare Rust build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config cmake libssl-dev
          rustup toolchain install 1.100.0 --profile minimal --target x86_64-unknown-linux-gnu
      - name: Build and package the production executable
        shell: bash
        run: |
          bundle='soulsteads-model-router-linux-x86_64'
          mkdir -p "$RUNNER_TEMP/$bundle" dist
          export CARGO_TARGET_DIR="$RUNNER_TEMP/release-target"
          export CARGO_PROFILE_RELEASE_DEBUG=0 CARGO_PROFILE_RELEASE_STRIP=debuginfo
          # Ubuntu 24.04 GNU/Linux build; do not include dev/test executables.
          cargo +1.100.0 build --release --locked --target x86_64-unknown-linux-gnu --bin soulsteads-router
          # Exercise both unit scopes without contacting systemd or a provider.
          PYTHONDONTWRITEBYTECODE=1 python3 tests/service_install_validation.py --binary "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/soulsteads-router"
          install -m 0755 "$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/soulsteads-router" "$RUNNER_TEMP/$bundle/soulsteads-router"
          install -m 0644 LICENSE NOTICE "$RUNNER_TEMP/$bundle/"
          install -m 0644 third_party/LiteLLM-LICENSE.txt "$RUNNER_TEMP/$bundle/"
          # The router takes a config path, not --help. Validate a disposable fixture without starting it.
          (
            umask 077
            smoke=$(mktemp -d "$RUNNER_TEMP/slotline-smoke.XXXXXXXX")
            openssl rand -hex 32 > "$smoke/smoke.key"
            key_path=$(jq -Rn --arg path "$smoke/smoke.key" '$path')
            cat > "$smoke/smoke.yaml" <<YAML
          listener_mode: loopback
          bind: 127.0.0.1
          port: 4011
          credentials:
            - {name: fixture, key_file: $key_path, aliases: [fixture], class: interactive, requests_per_minute: 100, burst: 20, max_in_flight: 2}
          routes:
            - {name: fixture, kind: local, base_url: 'http://127.0.0.1:18121/v1', model: fixture, safe_concurrency: 1, context_limit: 2000, adapter_version: fixture, capabilities: [text], timeout_seconds: 1, enabled: true}
          aliases:
            fixture: {context_limit: 2000, capabilities: [text], routes: [{route: fixture, priority: 10}]}
          YAML
            "$RUNNER_TEMP/$bundle/soulsteads-router" --check-config "$smoke/smoke.yaml"
          )
          cargo +1.100.0 metadata --format-version 1 --locked --filter-platform x86_64-unknown-linux-gnu > "$RUNNER_TEMP/cargo-metadata.json"
          python3 - "$RUNNER_TEMP/cargo-metadata.json" "$RUNNER_TEMP/$bundle" <<'PY'
          import json
          from pathlib import Path
          import re

          import sys

          metadata = json.loads(Path(sys.argv[1]).read_text())
          bundle = Path(sys.argv[2])
          notices = bundle / 'dependency-notices'
          notices.mkdir()
          resolve = metadata['resolve']
          nodes = {node['id']: node for node in resolve['nodes']}
          packages = {pkg['id']: pkg for pkg in metadata['packages']}
          root = resolve['root']
          selected = set()
          pending = [root]
          while pending:
              package = pending.pop()
              if package in selected:
                  continue
              selected.add(package)
              pending.extend(dep['pkg'] for dep in nodes[package]['deps']
                             if any(kind['kind'] != 'dev' for kind in dep['dep_kinds']))

          rows = []
          legal = re.compile(r'(license|licence|copying|copyright|notice|patents|unlicense)(?:$|[._-])', re.I)
          for package in sorted(selected - {root}):
              pkg = packages[package]
              source = Path(pkg['manifest_path']).parent.resolve()
              target = notices / (pkg['name'] + '-' + pkg['version'])
              files = {path for path in source.rglob('*')
                       if path.is_file() and legal.match(path.name) and path.suffix != '.rs'}
              if pkg['license_file']:
                  files.add(source / pkg['license_file'])
              copied = []
              for path in sorted(files):
                  relative = path.relative_to(source)
                  if '..' in relative.parts or not path.resolve().is_relative_to(source):
                      raise SystemExit(f'License file outside crate: {target.name}')
                  content = path.read_bytes()
                  if not content.strip():
                      continue
                  dest = target / relative
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(content)
                  copied.append(relative.as_posix())
              if not copied:
                  raise SystemExit(f'No nonempty license or notice files for {target.name}')
              rows.append(f"{target.name}\t{pkg['license'] or 'See packaged license file'}\t{', '.join(copied)}\n")
          (notices / 'INDEX.tsv').write_text('Crate\tDeclared license\tFiles supplied by the crate\n' + ''.join(rows))
          PY
          tar -czf "dist/$bundle.tar.gz" -C "$RUNNER_TEMP" "$bundle"
      - name: Generate and verify asset checksums
        working-directory: dist
        run: |
          sha256sum -- soulsteads-model-router-linux-x86_64.tar.gz > SHA256SUMS
          sha256sum --strict --check SHA256SUMS
      - name: Pass assets to the publishing job
        if: github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attach assets to the published release
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-assets-${{ github.event.release.id }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify and upload assets without replacing existing files
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          archive=soulsteads-model-router-linux-x86_64.tar.gz
          files=("$archive" SHA256SUMS)
          shopt -s dotglob nullglob
          entries=(*)
          if [[ ${#entries[@]} -ne ${#files[@]} ]]; then
            echo 'Expected exactly the release archive and SHA256SUMS.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            if [[ ! -f "$file" || -L "$file" ]]; then
              printf 'Expected a regular, non-symlink release asset: %s\n' "$file" >&2
              exit 1
            fi
          done
          # Compare against the producer's exact single-record format; never read paths from the manifest.
          if ! sha256sum -- "$archive" | cmp -s -- SHA256SUMS -; then
            echo 'SHA256SUMS must contain exactly the matching checksum for the release archive.' >&2
            exit 1
          fi
          [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false' <<< "$release" > /dev/null
          if jq -e '.immutable == true' <<< "$release" > /dev/null; then
            echo 'This release is immutable; GitHub requires assets to be attached before publication.' >&2
            exit 1
          fi

          # Confirm the tag has not moved since the event. Annotated tags have a peeled ref.
          ref="refs/tags/$RELEASE_TAG"
          refs=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" "$ref" "$ref^{}")
          object=$(awk -v ref="$ref" '$2 == ref { print $1 }' <<< "$refs")
          peeled=$(awk -v ref="$ref^{}" '$2 == ref { print $1 }' <<< "$refs")
          [[ "${peeled:-$object}" == "$GITHUB_SHA" ]]

          # Read from the immutable artifact handoff, and upload to the exact event release ID.
          # Resume interrupted uploads only when already-present bytes are identical.
          existing=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100")
          for file in "${files[@]}"; do
            expected="sha256:$(sha256sum -- "$file" | cut -d ' ' -f 1)"
            prior=$(jq -c --arg name "$file" 'flatten | map(select(.name == $name))' <<< "$existing")
            if [[ "$prior" == '[]' ]]; then
              continue
            fi
            if ! jq -e --arg digest "$expected" 'length == 1 and .[0].digest == $digest and .[0].state == "uploaded"' <<< "$prior" > /dev/null; then
              printf 'Asset already exists with different or unverified bytes: %s\n' "$file" >&2
              exit 1
            fi
          done
          for file in "${files[@]}"; do
            if jq -e --arg name "$file" 'flatten | any(.name == $name)' <<< "$existing" > /dev/null; then
              continue
            fi
            asset_name=$(jq -rn --arg name "$file" '$name | @uri')
            expected="sha256:$(sha256sum -- "$file" | cut -d ' ' -f 1)"
            curl --silent --show-error --fail-with-body --max-time 180 \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' \
              --data-binary "@$file" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$asset_name" \
              | jq -e --arg name "$file" --arg digest "$expected" \
                  '.name == $name and .digest == $digest and .state == "uploaded"' > /dev/null
          done
